[project]
name = "ragdocs-enterprise"
version = "0.1.0"
description = "Sistema de Q&A sobre documentação técnica interna com RAG avançado"
requires-python = ">=3.11"
dependencies = [
    # --- API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",  

    # --- Config ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",

    # --- LangChain (orquestração do pipeline RAG) ---
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-community>=0.3.5",       
    "langchain-text-splitters>=0.3.0",  
    "langchain-groq>=0.2.0",        
    "langchain-postgres>=0.0.12",    
    "langchain-huggingface>=0.1.2",    

    # --- Banco de dados / Vetores (schema de domínio próprio) ---
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.5",
    "alembic>=1.13.0",       

    # --- Loaders de documentos ---
    "pypdf>=5.0.0",
    "unstructured>=0.16.0",

    # --- Busca híbrida (lexical) ---
    "rank-bm25>=0.2.2",

    # --- Embeddings / Reranking (modelos locais, via sentence-transformers) ---
    "sentence-transformers>=3.2.0",
    "torch>=2.4.0",

    # --- Avaliação ---
    "ragas>=0.2.0",
    "datasets>=3.0.0",

    # --- Observabilidade ---
    "langfuse>=2.53.0",
    "langsmith>=0.1.140",

    # --- Dashboard ---
    "streamlit>=1.39.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",

    # --- Utilitários ---
    "httpx>=0.27.0",
    "tenacity>=9.0.0",          
    "structlog>=24.4.0",       
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]